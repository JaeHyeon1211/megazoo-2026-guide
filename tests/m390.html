<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 390×844 확인용 프레임</title>
<style>
  body{margin:0;background:#dcdcd6;font-family:-apple-system,sans-serif}
  .h{font-size:12px;padding:6px 8px;color:#333}
  iframe{width:390px;height:844px;border:0;display:block;background:#fff;box-shadow:0 0 0 2px #ff0000}
</style>
</head>
<body>
<div class="h">메가주 가이드 모바일(390×844) 확인용 프레임 · 실제 배포 페이지를 같은 폭의 iframe으로 엽니다 · ?v=값을 주면 그 값으로 캐시를 우회합니다</div>
<iframe id="f" title="모바일 390 확인"></iframe>
<script>
  (function(){
    var v = new URLSearchParams(location.search).get('v');
    document.getElementById('f').src = '../index.html' + (v ? '?v=' + encodeURIComponent(v) : '') + '#tab=course';
  })();
</script>
</body>
</html>
