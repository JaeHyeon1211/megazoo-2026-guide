<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f05322">
<title>메가주 2026 시즌2 · 부스·이벤트·동선 가이드</title>
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --ink:#191919; --ink2:#5b5b5b; --ink3:#8d8d8d;
    --line:#e5e5e0; --brand:#f05322; --brand-soft:#fff1ec;
    --h2:#2f6df6; --h3:#0e9f6e; --h4:#b45309; --h5:#a21caf; --hg:#0e7490; --ha:#6b7280;
    --fav:#eab308;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#e9e9e5;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
  #app{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;padding-bottom:88px}
  header{background:linear-gradient(160deg,#fff4ef,#fff 70%);
    border-bottom:1px solid var(--line);padding:14px 16px 10px}
  header h1{margin:0;font-size:19px;letter-spacing:-.4px}
  header h1 span{color:var(--brand)}
  header .sub{font-size:12.5px;color:var(--ink2);margin-top:3px}
  header .stat{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .pill{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
  .pill b{color:var(--ink);font-weight:700}

  /* controls */
  .controls{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line)}
  .search{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .search input{border:0;outline:0;flex:1;font-size:15px;background:transparent;color:var(--ink)}
  .search .clr{border:0;background:#eee;color:#666;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:1;display:none}
  .scroll{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;
    padding:7px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .chip[data-on="1"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.h2[data-on="1"]{background:var(--h2);border-color:var(--h2)}
  .chip.h3[data-on="1"]{background:var(--h3);border-color:var(--h3)}
  .chip.h4[data-on="1"]{background:var(--h4);border-color:var(--h4)}
  .chip.h5[data-on="1"]{background:var(--h5);border-color:var(--h5)}
  .chip.hg[data-on="1"]{background:var(--hg);border-color:var(--hg)}
  .chip.ha[data-on="1"]{background:var(--ha);border-color:var(--ha)}
  .chip.acc[data-on="1"]{background:var(--brand);border-color:var(--brand)}
  .row2{display:flex;gap:6px;align-items:center;justify-content:space-between}
  .sel{font-size:13px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 8px;color:var(--ink);font-weight:600}
  .count{font-size:12px;color:var(--ink3);padding:2px 12px 0}

  /* list */
  .list{padding:8px 12px 20px;display:flex;flex-direction:column;gap:9px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;position:relative}
  .card.fav{border-color:#f3d47a;box-shadow:0 0 0 1px #f6e3a8 inset}
  .card.done{opacity:.55}
  .card .top{display:flex;gap:8px;align-items:flex-start}
  .bnum{font-size:11.5px;font-weight:800;color:#fff;background:var(--ha);border-radius:7px;padding:3px 6px;letter-spacing:.2px;flex:0 0 auto}
  .bnum.h2{background:var(--h2)} .bnum.h3{background:var(--h3)} .bnum.h4{background:var(--h4)}
  .bnum.h5{background:var(--h5)} .bnum.hg{background:var(--hg)} .bnum.ha{background:var(--ha)}
  .name{flex:1;min-width:0}
  .name .t{font-weight:700;font-size:15.5px;letter-spacing:-.3px;word-break:keep-all}
  .name .m{font-size:11.5px;color:var(--ink3);margin-top:1px}
  .star{border:0;background:transparent;font-size:22px;line-height:1;color:#cfcfcf;padding:2px 2px 2px 6px;width:40px;height:36px}
  .star[data-fav="1"]{color:var(--fav)}
  .info{font-size:13px;color:var(--ink2);margin-top:8px;word-break:keep-all}
  .prods{font-size:12px;color:var(--ink3);margin-top:5px;word-break:keep-all}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:11px;padding:2.5px 7px;border-radius:6px;background:#f2f2ee;color:#555;font-weight:600}
  .tag.ev{background:var(--brand-soft);color:#c2410c}
  .tag.first{background:#fff7e6;color:#a16207}
  .tag.run{background:#fee2e2;color:#b91c1c}
  .tag.coupon{background:#f0e9ff;color:#5b21b6}
  .evwrap{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
  .evsummary{font-size:12.5px;color:#333;background:#fafaf7;border-radius:9px;padding:8px 10px;word-break:keep-all}
  .evsummary .lab{font-weight:800;color:var(--brand);font-size:11px;display:block;margin-bottom:2px}
  .more{border:0;background:transparent;color:#2563eb;font-size:12.5px;font-weight:700;padding:7px 0 0}
  .evfull{display:none;margin-top:6px}
  .evfull.open{display:block}
  .evfull .item{font-size:12.5px;color:#333;padding:7px 0;border-top:1px solid #f0f0ec;word-break:keep-all}
  .evfull .item:first-child{border-top:0}

  .tt{margin:10px 12px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
  .tth{font-size:13px;font-weight:800;margin-bottom:7px}
  .ttr{display:flex;gap:8px;font-size:12.5px;padding:5px 0;border-top:1px solid #f4f4f0}
  .ttr:first-of-type{border-top:0}
  .ttt{flex:0 0 62px;font-weight:800;color:var(--brand)}
  .ttb{flex:1;color:#333;word-break:keep-all}
  .ttn{font-size:11.5px;color:var(--ink3);margin-top:7px}

  /* course */
  .course{padding:10px 12px 24px}
  .hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
  .hero h2{margin:0 0 4px;font-size:16px}
  .hero p{margin:0;font-size:13px;color:var(--ink2);word-break:keep-all}
  .crset{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:6px;margin-top:11px}
  .crset label{display:block;font-size:10.5px;color:var(--ink3);font-weight:800;margin-bottom:3px}
  .crset select{width:100%;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 4px;color:var(--ink);font-weight:700}
  .crsum{font-size:12px;color:var(--ink2);margin-top:9px;background:#fafaf7;border:1px solid var(--line);border-radius:10px;padding:8px 10px;word-break:keep-all}
  .crfine{font-size:11.5px;color:var(--ink3);margin-top:6px;line-height:1.55;word-break:keep-all}
  .crfine b{color:var(--ink2)}
  /* 핵심 코스 프리셋 */
  .core{margin-top:10px;border:1px solid #f3d47a;background:#fffdf5;border-radius:12px;padding:10px 11px}
  .core .ch{font-size:12.5px;font-weight:800;color:#92620a}
  .core .ch em{font-style:normal;font-weight:600;color:#a98a4b;font-size:11.5px;margin-left:5px}
  .core .cl{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .core .ci{border:1px solid var(--line);background:#fff;color:#333;border-radius:8px;padding:5px 7px;font-size:11.5px;font-weight:700}
  .core .ci b{font-weight:800;color:var(--ink3);margin-left:4px;font-size:11px}
  .core .ci[data-fav="1"]{background:#fef3c7;border-color:#eab308;color:#7c4a03}
  .core .ci[data-fav="1"] b{color:#a16207}
  .core .cbtn{margin-top:9px;width:100%;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:9px;padding:8px;font-size:12.5px;font-weight:800}
  .core .calt{font-size:11px;color:var(--ink3);margin-top:7px;line-height:1.55;word-break:keep-all}
  .core .csub{font-size:10.5px;color:#8a6d2f;margin-top:4px;line-height:1.5;word-break:keep-all}
  .core .cgrp{margin-top:10px;border-top:1px dashed #e8d79a;padding-top:8px}
  .core .cgh{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#7c4a03}
  .core .cgh em{font-style:normal;font-weight:600;color:#a98a4b;font-size:10.5px}
  .core .cgadd{margin-left:auto;border:1px solid #e8c86a;background:#fff;color:#92620a;border-radius:7px;padding:3px 8px;font-size:10.5px;font-weight:800}
  .core .cgadd[data-on="1"]{background:#fde68a;border-color:#eab308}
  .citem{margin-top:7px;font-size:11px;font-weight:700;color:#92620a;background:#fffbeb;border:1px solid #f3d47a;border-radius:8px;padding:5px 8px;line-height:1.5;word-break:keep-all}
  .step .citem.in{margin-top:3px;font-size:10.5px;padding:4px 7px}
  .tag.core{background:#fde68a;color:#92400e}
  .ckpt{margin-top:9px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:7px 9px}
  .ckpt .ckh{font-size:11px;font-weight:800;color:#166534}
  .ckpt ul{margin:4px 0 0;padding-left:15px;font-size:11.5px;color:#333;line-height:1.55;word-break:keep-all}
  .ckpt li{margin:2px 0}
  .step .cks{margin-top:3px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:5px 8px;font-size:11px;color:#333;line-height:1.5;word-break:keep-all}
  .core .cnote{font-size:10.5px;color:#8a6d2f;margin-top:7px;line-height:1.5;word-break:keep-all}
  .cklinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .cklinks .purl{margin:0;font-size:11px;padding:4px 8px}
  .step .time{font-size:11.5px;color:#2563eb;font-weight:800;margin-top:2px}
  .step .time.anchor{color:var(--brand)}
  .step .time.warn{color:#b91c1c}
  .prog{height:8px;background:#eee;border-radius:99px;margin-top:11px;overflow:hidden}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,#f05322,#f59e0b);width:0%}
  .hero .nums{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-top:6px}
  .btnrow{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .hallhead{display:flex;align-items:center;gap:8px;margin:18px 2px 7px}
  .hallhead .hb{font-size:12px;font-weight:800;color:#fff;border-radius:7px;padding:3px 8px;background:var(--ha)}
  .hallhead .hb.h2{background:var(--h2)} .hallhead .hb.h3{background:var(--h3)}
  .hallhead .hb.h4{background:var(--h4)} .hallhead .hb.h5{background:var(--h5)}
  .hallhead .hb.hg{background:var(--hg)} .hallhead .hb.ha{background:var(--ha)}
  .hallhead .hs{font-size:12px;color:var(--ink3)}
  .step{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 11px;margin-bottom:8px}
  .step .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .step.isdone{background:#f0fdf4;border-color:#bbf7d0}
  .step.isdone .no{background:#16a34a}
  .step .body{flex:1;min-width:0}
  .step .t{font-weight:700;font-size:14.5px;word-break:keep-all}
  .step .t[data-open]{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-decoration-color:#cfcfc9}
  .step .m{font-size:11.5px;color:var(--ink3);margin-top:1px}
  .step .e{font-size:12px;color:#444;margin-top:5px;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .step .acts{display:flex;gap:6px;margin-top:8px}
  .tick{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700;color:#444}
  .tick[data-done="1"]{background:#16a34a;border-color:#16a34a;color:#fff}
  .empty{text-align:center;color:var(--ink3);font-size:13.5px;padding:40px 20px;line-height:1.7}

  /* map */
  .mapwrap{padding:12px}
  .mapctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .mapctl .sp{flex:1}
  .mapctl .zbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;font-size:14px;font-weight:800;color:var(--ink);line-height:1.1}
  .zlab{font-size:11.5px;font-weight:800;color:var(--ink2);min-width:32px;text-align:center}
  .stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  .stage.pinmode{outline:2px solid var(--brand);outline-offset:-2px}
  .canvas{position:relative;width:100%;transform-origin:0 0}
  .canvas img{display:block;width:100%;height:auto;pointer-events:none}
  .canvas svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  .maptip{font-size:11.5px;color:var(--ink3);margin-top:7px;line-height:1.55;word-break:keep-all}
  .legend{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:10px;line-height:1.6;word-break:keep-all}
  .legend b{color:var(--ink)}
  .legend .krow{display:flex;gap:6px;align-items:flex-start;margin-top:4px}
  .legend .kk{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;color:#fff}

  /* booth sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-radius:16px 16px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,.18);transform:translateY(106%);transition:transform .22s ease;
    max-height:80vh;overflow:auto;padding:12px 14px calc(20px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
  .sheet.on{transform:translateY(0)}
  .sheet .grab{width:42px;height:4px;border-radius:2px;background:#e2e2dc;margin:0 auto 10px}
  .sheet .sh{display:flex;gap:8px;align-items:flex-start}
  .sheet .sh .x{margin-left:auto;border:0;background:#f1f1ee;border-radius:50%;width:30px;height:30px;font-size:14px;font-weight:800;color:#555;flex:0 0 auto}
  .sheet .item{font-size:12.5px;color:#333;padding:6px 0;border-top:1px solid #f2f2ee;word-break:keep-all}
  .sheet .item:first-child{border-top:0}
  .chk{display:inline-block;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 5px;background:#ecfdf5;color:#065f46;margin-right:4px}
  .chk.buy{background:#fff7ed;color:#9a3412}
  .step .acts{flex-wrap:wrap}
  .tick.revon{background:#ede9fe;border-color:#c4b5fd;color:#5b21b6}
  .rev{background:#f7f5ff;border:1px solid #ddd6fe;border-radius:13px;padding:11px;margin:12px 0 4px}
  .rev h3{margin:0 0 4px;font-size:13.5px;color:#5b21b6}
  .rev .rstep{display:flex;gap:7px;font-size:12.5px;color:#333;padding:5px 0;border-top:1px dashed #e5e0fb;word-break:keep-all}
  .rev .rno{flex:0 0 18px;height:18px;border-radius:50%;background:#7c3aed;color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}

  /* info */
  .info-page{padding:12px}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
  .box h3{margin:0 0 7px;font-size:14.5px}
  .box dl{margin:0;font-size:13px;color:var(--ink2)}
  .box dl div{display:flex;gap:10px;padding:4px 0;border-top:1px solid #f4f4f0}
  .box dl div:first-child{border-top:0}
  .box dt{flex:0 0 82px;color:var(--ink3);font-size:12.5px}
  .box dd{margin:0;flex:1}
  .box ul{margin:0;padding-left:18px;font-size:12.8px;color:var(--ink2)}
  .box li{margin:3px 0}
  .box a{color:#2563eb}

  /* price compare */
  .pl{margin-top:8px;border-top:1px dashed #e8e8e2;padding-top:6px}
  .pl .pr{display:flex;gap:6px;align-items:baseline;font-size:11.5px;color:#374151;padding:1px 0;word-break:keep-all}
  .pl .k{font-size:10px;font-weight:800;color:#065f46;background:#ecfdf5;border-radius:5px;padding:1px 5px;flex:0 0 auto}
  .pl .k.low{color:#9a3412;background:#fff7ed}
  .pl .k.cond{color:#4b5563;background:#f3f4f6}
  .pl .v{font-weight:800;color:#111}
  .pl .s{color:var(--ink3);font-size:10.5px;min-width:0}
  .pl .tip{font-size:10.5px;color:var(--ink3);margin-top:2px;word-break:keep-all}
  .pl .tip .purl{color:#1d4ed8;font-weight:700;text-decoration:none;border-bottom:1px solid #bfdbfe}
  .price-page{padding:12px}
  .price-page .ph{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
  .price-page .ph h2{margin:0 0 5px;font-size:16px;letter-spacing:-.3px}
  .price-page .ph p{margin:0;font-size:12.5px;color:var(--ink2);word-break:keep-all}
  .pcat-h{font-size:12px;font-weight:800;color:var(--ink3);margin:14px 2px 6px}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px}
  .pcard .pname{font-size:14px;font-weight:700;word-break:keep-all;line-height:1.4}
  .pcard .pname em{font-style:normal;font-size:11.5px;color:var(--ink3);font-weight:600;margin-left:5px}
  .pcard .pbooth{margin-top:4px;border:0;background:#f3f4f6;color:#374151;border-radius:7px;padding:3px 7px;font-size:11px;font-weight:700}
  .pcard .prow{display:flex;gap:7px;align-items:baseline;margin-top:6px;font-size:12.5px;color:var(--ink2)}
  .pcard .pk{flex:0 0 auto;min-width:46px;white-space:nowrap;font-size:10.5px;font-weight:800;color:#065f46;background:#ecfdf5;border-radius:5px;padding:1px 5px;text-align:center}
  .pcard .prow.low .pk{color:#9a3412;background:#fff7ed}
  .pcard .prow.cond .pk{color:#4b5563;background:#f3f4f6}
  .pcard .prow.cond b{color:#4b5563}
  .pcard .pobs{margin-top:6px;font-size:11px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:5px 7px;line-height:1.5;word-break:keep-all}
  .pcard .ps{flex:1;min-width:0;word-break:keep-all}
  .pcard .prow b{font-size:13.5px;color:#111;white-space:nowrap}
  .pcard .pnote{margin-top:6px;font-size:11px;color:var(--ink3);word-break:keep-all;line-height:1.5}
  .pcard .pkind{display:inline-block;margin-top:5px;border:1px solid #dbeafe;background:#eff6ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:800}
  .pcard .pmeta{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px;font-size:11.5px;color:var(--ink2);line-height:1.5}
  .pcard .pmeta>div{display:flex;gap:6px;margin-top:3px;word-break:keep-all}
  .pcard .pmeta>div>span{flex:0 0 52px;font-size:10.5px;font-weight:800;color:var(--ink3)}
  .pcard .pmeta p{margin:0;flex:1;min-width:0}
  .pcard .purl{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:700;color:#1d4ed8;text-decoration:none;border-bottom:1px solid #bfdbfe}
  .pcheck{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px 11px 12px;margin-bottom:10px}
  .pcheck-h{font-size:12.5px;font-weight:800;margin-bottom:4px}
  .pcheck ol{margin:0;padding-left:18px;font-size:11.5px;color:var(--ink2);line-height:1.6;word-break:keep-all}

    const rRow = {};
    others.forEach(b=>{ const k = ROW_OF[b.id]; (rRow[k] = rRow[k] || []).push(b); });
    Object.keys(rRow).map(Number).sort((a,b)=>a-b).forEach((k,n)=>{
      out.push(...rRow[k].slice().sort((a,b)=> n%2 ? b.x-a.x : a.x-b.x));
    });
    return out;
  }
  function routeOrder(list){
    const out = [];
    HALL_ORDER.forEach(h=>{ out.push(...hallRoute(list.filter(b=>hallKey(b)===h), h)); });
    return out;
  }
  function orderByHall(list){ return routeOrder(list); }

  // 이벤트 문구의 요일 표기(금·토 / 일 / 매일)를 시간 앞에서 찾아 묶는다
  function daySetBefore(txt, idx){
    const seg = txt.slice(Math.max(0, idx-48), idx);
    const re = /(매일|평일|주말|금요일|토요일|일요일|금|토|일)/g;
    const marks = []; let m;
    while((m = re.exec(seg))){
      const before = seg[m.index-1] || '';
      if(/[0-9]/.test(before) || /[가-힣]/.test(before)) continue;  // '1일 2회', '매일' 속 '일' 제외
      marks.push({i:m.index, t:m[1]});
    }
    if(!marks.length) return null;
    const group = [marks[marks.length-1]];                        // 마지막 요일 묶음만 사용
    for(let k=marks.length-2;k>=0;k--){
      const gap = seg.slice(marks[k].i + marks[k].t.length, group[0].i);
      if(/^[\s·,|/]*$/.test(gap)) group.unshift(marks[k]); else break;
    }
    const out = new Set();
    group.forEach(x=>{
      const t = x.t.replace('요일','');
      if(t==='매일' || t==='평일' || t==='주말') out.add('#all');
      else out.add({'금':5,'토':6,'일':0}[t]);
    });
    return out.size ? out : null;
  }
  // 공개 문구에 시각이 적힌 이벤트만 [{min, days}] 로 추출
  function evTimeList(b){
    if(b._times) return b._times;
    const res = [];
    (b.ev||[]).forEach(txt=>{
      const re = /(오전|오후)\s?(\d{1,2})\s?시(?:\s?(\d{1,2})\s?분)?|(\d{1,2}):(\d{2})/g;
      let m;
      while((m = re.exec(txt))){
        let hh, mm;
        if(m[4] != null){ hh = parseInt(m[4],10); mm = parseInt(m[5],10); }
        else {
          hh = parseInt(m[2],10); mm = m[3]? parseInt(m[3],10) : 0;
          if(m[1]==='오후' && hh<12) hh += 12;
          if(m[1]==='오전' && hh===12) hh = 0;
        }
        if(hh<8 || hh>19) continue;                                  // 관람시간 밖 표기는 제외
        res.push({min: hh*60+mm, days: daySetBefore(txt, m.index)});
      }
    });
    b._times = res;
    return res;
  }
  function evTimesFor(b, dow){
    const out = [];
    evTimeList(b).forEach(t=>{
      if(!t.days || t.days.has('#all') || t.days.has(dow)) out.push(t.min);
    });
    return [...new Set(out)].sort((a,b)=>a-b);
  }
  function fmtMin(m){
    m = Math.max(0, Math.round(m));
    const h = Math.floor(m/60), mm = m%60;
    return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;
  }
  function courseOpt(){
    const day = VISITS.find(v=>v.k===course.day) || VISITS[0];
    return {dow: day.dow, startMin: +course.start || 570, startPt: ENTRIES[course.entry] || ENTRIES['2']};
  }

  // 정시 이벤트를 시간표로 고정하고, 그 사이에 통로 지그재그 순서의 부스를 끼워 넣는다
  function buildRoute(ids, opt){
    const list = ids.map(id=>BY[id]).filter(Boolean);
    const startPt = opt.startPt, dow = opt.dow, startMin = opt.startMin;
    const timed = [], rush = [], rest = [];
    list.forEach(b=>{
      const ts = evTimesFor(b, dow).filter(t=> t >= startMin && t <= 18*60);
      if(ts.length){ b._anchor = ts[0]; timed.push(b); }
      else if(b.openRun && startMin <= 576){ b._anchor = 570; timed.push(b); }   // 오픈런은 개장 09:30에 먼저(그 뒤 출발이면 일반 순서)
      else { (b.openRun || b.firstCome) ? rush.push(b) : rest.push(b); }
    });
    timed.sort((a,b)=> (a._anchor-b._anchor) || (dist(startPt,a)-dist(startPt,b)));
    let pool = routeOrder(rush.concat(rest));   // 대기열도 2홀 입구 기준 동선 순서
    const anchors = timed.slice();
    const steps = [];
    let cur = startPt, curT = startMin, guard = 0;
    while((anchors.length || pool.length) && guard++ < 5000){
      const anchor = anchors[0] || null;
      let chosen = null;
      const cands = pool;
      if(anchor){
        const slack = anchor._anchor - curT;          // 이벤트 전까지 남은 시간(분)
        for(let i=0;i<cands.length;i++){
          const b = cands[i];
          const toB = dist(cur,b), bToA = dist(b,anchor), toA = dist(cur,anchor);
          const extra = (toB + bToA - toA)*WALK_MIN + dwellNow();   // 우회 추가 비용(분)
          const arriveA = curT + (toB + bToA)*WALK_MIN + dwellNow();
          if(arriveA <= anchor._anchor - 5 && extra <= Math.max(0, slack-5)*0.7){
            chosen = b;   // 정시 이벤트를 놓치지 않는 범위에서 가로 훑기 순서대로 우회
            break;
          }
        }
      } else {
        chosen = cands[0];   // 가로 훑기 순서 그대로
      }
      if(!chosen){
        const proj = curT + dist(cur,anchor)*WALK_MIN;
        steps.push({b:anchor, arrive: proj, anchor: anchor._anchor, late: proj > anchor._anchor + 1});
        curT = Math.max(proj, anchor._anchor) + dwellNow();
        cur = anchor;
        anchors.shift();
      } else {
        curT += dist(cur, chosen)*WALK_MIN;
        steps.push({b:chosen, arrive: curT});
        curT += dwellNow();
        cur = chosen;
        pool = pool.filter(x=> x !== chosen);
      }
    }
    return steps;
  }
  function timeHint(b){
    const txt = (b.ev||[]).join(' ');
    const m = txt.match(/(오전|오후)\s?\d{1,2}\s?시(\s?\d{1,2}\s?분)?/g);
    if(m) return [...new Set(m)].slice(0,3).join(' · ');
    if(/매일\s?선착순/.test(txt)) return '매일 선착순';
    if(/선착순/.test(txt)) return '선착순';
    if(/소진 시|조기 ?마감/.test(txt)) return '소진 시 마감';
    return '';
  }

  // ---------- filtering ----------
  // 이벤트 참여 조건 — 원문 문구는 그대로 두고 '구매 필요/구매 없이'만 화면에서 나눠 본다
  const BUY_RE = /(구매\s*시|구매\s*이벤트|제품\s*구매|구매\s*후|구매\s*조건|결제|구입|영수증|원\s*이상|만원\s*이상)/;
  const GIVE_RE = /(증정|샘플|체험|뽑기|룰렛|추첨|참여|팔로우|구독|회원가입|인증|시식|쿠폰|할인|선물|기프트|데모)/;
  function evNoBuy(b){
    return (b.ev||[]).some(t=> !BUY_RE.test(t) && GIVE_RE.test(t));
  }
  function evTag(t){
    if(BUY_RE.test(t)) return '<span class="chk buy">구매 필요</span>';
    if(GIVE_RE.test(t)) return '<span class="chk">구매 없이</span>';
    return '';
  }
  function courseDow(){ return (VISITS.find(v=>v.k===course.day) || VISITS[0]).dow; }
  function match(b){
    if(hall !== 'all' && b.hall !== hall) return false;
    if(cat !== 'all'){
      const cs = b.cats && b.cats.length ? b.cats : [b.cat];
      if(!cs.includes(cat)) return false;
    }
    if(evFilter.has('ev') && !(b.ev && b.ev.length)) return false;
    if(evFilter.has('noBuy') && !evNoBuy(b)) return false;
    if(evFilter.has('time') && !evTimesFor(b, courseDow()).length) return false;
    if(evFilter.has('openRun') && !b.openRun) return false;
    if(evFilter.has('firstCome') && !b.firstCome) return false;
    if(evFilter.has('coupon') && !b.coupon) return false;
    if(evFilter.has('fav') && !favs.has(b.id)) return false;
    if(q){
      const hay = [b.id, b.label, b.cat, (b.cats||[]).join(' '), (b.ev||[]).join(' ')]
        .concat((b.brands||[]).flatMap(x=>[x.n, x.e, x.c, x.cat, x.sub, x.i]))
        .join(' ').toLowerCase();
      if(!hay.includes(q.toLowerCase())) return false;
    }
    return true;
  }
  function sortedList(){
    const arr = BOOTHS.filter(match);
    if(sortMode === 'route') return orderByHall(arr);
    if(sortMode === 'booth'){
      return arr.slice().sort((a,b)=>{
        const h = HALLIDX[a.hall] - HALLIDX[b.hall];
        if(h) return h;
        const na = parseInt(a.id.replace(/\D/g,''))||0, nb = parseInt(b.id.replace(/\D/g,''))||0;
        return na-nb || a.id.localeCompare(b.id);
      });
    }
    // event first: 부스 중 이벤트 있는 곳 먼저, 그 다음 나머지
    return arr.slice().sort((a,b)=>{
      const ea = (a.ev&&a.ev.length)?0:1, eb = (b.ev&&b.ev.length)?0:1;
      if(ea!==eb) return ea-eb;
      return (HALLIDX[a.hall]-HALLIDX[b.hall]) || ((parseInt(a.id.replace(/\D/g,''))||0)-(parseInt(b.id.replace(/\D/g,''))||0));
    });
  }

  // ---------- render ----------
  const view = document.getElementById('view');
  function imgSrc(name){ return (window.MZIMG && window.MZIMG[name]) || name; }
  const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function tagRow(b, max){
    const t = [];
    const cc = CORE_BY[b.id];
    if(cc) cc.items.forEach(x=>t.push('<span class="tag core">'+esc(x)+'</span>'));
    if(b.openRun) t.push('<span class="tag run">오픈런</span>');
    if(b.firstCome) t.push('<span class="tag first">선착순</span>');
    if(b.coupon) t.push('<span class="tag coupon">쿠폰</span>');
    (b.t||[]).filter(x=>!['오픈런','선착순','쿠폰'].includes(x)).slice(0, max||3)
      .forEach(x=>t.push('<span class="tag ev">'+esc(x)+'</span>'));
    if(!t.length && b.cats && b.cats.length) t.push('<span class="tag">'+esc(b.cat||'')+'</span>');
    return t.join('');
  }
  function card(b){
    const br = (b.brands||[]).find(x=>x.i) || (b.brands||[])[0] || {};
    const nm = b.label || ('부스 '+b.id);
    const meta = [b.id, HALLNAME[b.hall], b.cat || (br.cat||'')].filter(Boolean).join(' · ');
    const first = (b.ev&&b.ev.length) ? b.ev[0] : '';
    const more = (b.ev&&b.ev.length>1) ? ('이벤트 ' + b.ev.length + '개 전체 보기') : '이벤트 자세히';
    return '<div class="card'+(favs.has(b.id)?' fav':'')+'" data-id="'+esc(b.id)+'">'
      + '<div class="top">'
      +   '<span class="bnum '+HALLCLS[b.hall]+'">'+esc(b.id)+'</span>'
      +   '<div class="name"><div class="t">'+esc(nm)+'</div><div class="m">'+esc(meta)+(b.approx?' · 위치 근사값':'')+'</div></div>'
      +   '<button class="star" data-star="'+esc(b.id)+'" data-fav="'+(favs.has(b.id)?'1':'0')+'" aria-label="즐겨찾기">'+(favs.has(b.id)?'★':'☆')+'</button>'
      + '</div>'
      + ((br.p&&br.p.length)? '<div class="prods clamp">대표 제품 · '+esc(br.p.join(' / '))+'</div>' : '')
      + (br.i ? '<button class="tgl" data-desc="'+esc(b.id)+'">브랜드 설명 ▾</button><div class="dsc" id="dsc-'+esc(b.id)+'">'+esc(br.i)+'</div>' : '')
      + priceBlock(b)
      + (b.ev&&b.ev.length ? ('<div class="evwrap"><div class="evsummary clamp"><span class="lab">현장 이벤트</span>'+esc(first)+'</div>'
          + '<button class="more" data-more="'+esc(b.id)+'">'+more+'</button>'
          + '<div class="evfull" id="ev-'+esc(b.id)+'">'+b.ev.map(e=>'<div class="item">'+evTag(e)+esc(e)+'</div>').join('')+'</div>'
          + '</div>') : '')
      + '<div class="tags">'+tagRow(b)+'</div>'
      + coreItemLine(b)
      + ckBlock(b)
      + '</div>';
  }
  // 핵심 코스 부스에만 붙는 '이 부스에서 볼 필수품목' 줄
  function coreItemLine(b){

  // 핵심 코스 부스에만 붙는 현장 확인 포인트 (+ 공식 제품 링크)

      + '</div>';

  function renderBooth(){
    shownBooths = BOOTH_PAGE;
    let html = '<div class="controls">'
      + '<div class="search"><input id="q" placeholder="브랜드·부스번호·품목 검색 (예: 라포그, 3238)" value="'+esc(q)+'">'

      + '</div></div>'

      + '<select class="sel" id="sort"><option value="route" '+(sortMode==='route'?'selected':'')+'>동선순</option>'

  // 검색 결과 목록만 갱신 (입력창 DOM·포커스 유지)
  const BOOTH_PAGE = 60;
  let shownBooths = BOOTH_PAGE;
  function paintBoothList(){
    const arr = sortedList();
    const evCount = arr.filter(b=>b.ev&&b.ev.length).length;
    const list = document.getElementById('list');
    if(list){
      const part = arr.slice(0, shownBooths);
      list.innerHTML = part.length
        ? part.map(card).join('') + (arr.length > part.length
            ? '<button class="morelist" id="morebooth">'+part.length+' / '+arr.length+'곳 표시 중 · 다음 '+(BOOTH_PAGE)+'곳 보기</button>'

    if(cnt) cnt.textContent = arr.length+'개 부스 · 이벤트 있는 부스 '+evCount+'개';

  function timeGroups(){
    const map = {};
    BOOTHS.forEach(b=>{
      (b.ev||[]).forEach(txt=>{
        const mm = txt.match(/(오전|오후)\s?\d{1,2}\s?시/g);
        if(!mm) return;
        mm.forEach(t=>{
          const k = t.replace(/\s/g,'');
          (map[k] = map[k] || []).push(b);
        });
      });
    });
    const order = k => { const m = k.match(/(오전|오후)(\d+)/); let h = parseInt(m[2]); if(m[1]==='오후' && h!==12) h+=12; if(m[1]==='오전' && h===12) h=0; return h; };
    return Object.keys(map).sort((a,b)=>order(a)-order(b)).map(k=>{
      const seen = {}; const list = [];
      map[k].forEach(b=>{ if(!seen[b.id]){ seen[b.id]=1; list.push(b); } });
      return {time:k, booths:list};
    });
  }
  function renderEvent(){

  // 이벤트 탭: 기본 화면에서도 hall·cat·q·이벤트 필터를 항상 거친 뒤 정렬한다
  // 부스 번호 미확인 브랜드도 같은 필터를 적용한다(홀·카테고리 정보가 없으면 지정 시 숨김)
  function unplacedMatch(u){
    if(evFilter.has('fav')) return false;
    if(evFilter.has('time')) return false;   // 시간이 공개되지 않은 브랜드는 '시간 정해진'에서 뺀다
    if(evFilter.has('noBuy') && !(u.ev||[]).some(t=> !BUY_RE.test(t) && GIVE_RE.test(t))) return false;
    const txt = [u.n].concat(u.ev||[]).join(' ');
    if(evFilter.has('openRun') && !/오픈런/.test(txt)) return false;
    if(evFilter.has('firstCome') && !/선착순/.test(txt)) return false;
    if(evFilter.has('coupon') && !/쿠폰/.test(txt)) return false;
    if(hall !== 'all' || cat !== 'all') return false;
    if(q && !txt.toLowerCase().includes(q.toLowerCase())) return false;
    return true;
  }
  function paintEventList(){
    const evBooths = BOOTHS.filter(b=>b.ev&&b.ev.length);
    const arr = evBooths.filter(match).sort((a,b)=> (HALLIDX[a.hall]-HALLIDX[b.hall]) || ((parseInt(a.id.replace(/\D/g,''))||0)-(parseInt(b.id.replace(/\D/g,''))||0)));
    const un = (MZ.unplaced || []).filter(unplacedMatch);
    const cnt = document.getElementById('cnt');
    if(cnt) cnt.textContent = '주최측 공개 현장이벤트 · 부스 '+arr.length+'곳'+(un.length?' + 부스 미확인 '+un.length+'곳':'');
    const list = document.getElementById('list');
    if(!list) return;
    list.innerHTML = arr.map(card).join('')
      + (un.length? ('<div class="hallhead"><span class="hb ha">?</span><span class="hs">부스 번호가 공개 자료에 없는 브랜드</span></div>'
          + un.map(u=>'<div class="card"><div class="top"><span class="bnum ha">?</span><div class="name"><div class="t">'+esc(u.n)+'</div>'
            + '<div class="m">부스 번호 미확인 · 현장 안내데스크/앱에서 검색</div></div></div>'
            + '<div class="evwrap"><div class="evsummary"><span class="lab">현장 이벤트</span>'+esc(u.ev[0]||'')+'</div>'
            + (u.ev.length>1? '<div class="evfull open">'+u.ev.slice(1).map(e=>'<div class="item">'+esc(e)+'</div>').join('')+'</div>':'')

  // 핵심 코스 프리셋 — 재현 님 필수 품목의 전수 부스를 품목별로 묶어 한 번에 담는다
  // 영양제·보조제 분류 기준 — 형태가 아니라 제조사 용도·성분·급여법으로 나눈다
  const SUPP_RULE = '영양제로 넣을지는 제품 형태(져키·필름·츄르)가 아니라 ① 제조사가 내건 용도(영양제·보조제 / 일반 간식·사료·샴푸) ② 성분·보장량 ③ 급여법(먹이는지, 바르는지, 씻는지)로 정했습니다. 그래서 져키·필름·츄르 형태라도 영양제로 파는 제품은 각 품목 칸에 넣었고(5523 포피펫필름·캐피펫필름, 5734 메이드인랩 눈 건강 져키형), 사료·간식·샴푸에 성분으로 든 유산균·오메가3는 뺐습니다. 2427 닥터아나 3-6-9 오일은 「바르는 오메가3」로 확인돼(2026-11-18) 뺐습니다. 5623 닥터헤리엇은 츄르 형태 영양제(오랄케어·가스트로)를 팔지만 장 건강 제품이 유산균 제제인지 표시사항으로 확인하지 못해 유산균 칸에 넣지 않았습니다 — 제외 목록에서 실제 영양제로 팔리는 제품이 빠진 것으로 확인되면 칸에 넣습니다.';
  // 방문 후보와 내 코스 담기를 구분하는 안내
  function candidateNotice(){
    return '표시된 '+CORE_N+'곳은 <b>방문 후보</b>이고(현장 판매·재고 확인 전), 아래 「이 품목 담기」를 눌러야 내 코스에 들어갑니다.';
  }
  let coreOpen = false;
  function coreBox(){
    const on = CORE_IDS.filter(id=>favs.has(id)).length;
    const groups = CORE_GROUPS.map(g=>{
      const ids = CORE_IDS_OF(g.key).filter(id=>BY[id]);
      const cnt = ids.filter(id=>favs.has(id)).length;
      const chips = CORE.filter(c=>c.grp.includes(g.key)).map(c=>{
        const b = BY[c.id];
        const where = b ? (HALLNAME[b.hall]+' · '+(b.label||c.brand)) : c.brand;
        const more = c.items.filter(x=>x!==g.label);
        const tip = where + (more.length ? ' · '+more.join('·')+'도 있음' : '');
        return '<button class="ci" data-core="'+esc(c.id)+'" data-fav="'+(favs.has(c.id)?1:0)+'" title="'+esc(tip)+'">'

      return '<div class="cgrp"><div class="cgh"><span>'+esc(g.label)+'</span><em>'+ids.length+'곳 · '+cnt+' 담김</em>'

    }).join('');
    return '<div class="core"><div class="corebar"><div class="ch">🎯 필수품목 '+CORE_N+'곳 <em>'+on+' 담김</em></div>'
      + '<button class="cbt" id="coretoggle">'+(coreOpen?'접기 ▲':'펼치기 ▾')+'</button></div>'
      + '<div class="fold'+(coreOpen?' open':'')+'">'
      + '<div class="cnote">'+candidateNotice()+'</div>'
      + '<button class="cbtn" id="cadd">'+(on===CORE.length?'핵심 '+CORE_N+'곳 빼기':'핵심 '+CORE_N+'곳 한 번에 담기')+'</button>'
      + groups
      + '<div class="calt">선정 기준·제외한 곳은 <b>안내</b> 탭에 있어요.</div></div></div>';
  }
  function renderCourse(){
    if(courseView === 'item'){ renderItems(); return; }
    const opt = courseOpt();
    const steps = buildRoute([...favs], opt);
    const total = steps.length;
    const dn = steps.filter(s=>done.has(s.b.id)).length;
    const pctv = total? Math.round(dn/total*100) : 0;
    const anchorN = steps.filter(s=>s.anchor!=null).length;
    const anchorCount = {};
    steps.forEach(s=>{ if(s.anchor != null) anchorCount[s.anchor] = (anchorCount[s.anchor]||0)+1; });
    const dayLabel = (VISITS.find(v=>v.k===course.day) || VISITS[0]).label;
    const dwell = dwellNow();
    const revSteps = steps.filter(s=>rev.has(s.b.id));
    let mUnits = 0, walkPt = opt.startPt;
    steps.forEach(s=>{ mUnits += dist(walkPt, s.b); walkPt = s.b; });
    const meters = Math.round(mUnits * UNIT_M);
    const endMin = total ? steps[total-1].arrive + dwell : 0;
    const moveMin = Math.round(meters / PACE_MPM);
    let html = '<div class="course">' + courseSeg();
    html += '<div class="hero"><h2>내 방문 순서</h2>'
      + '<p>'+(total
          ? '2홀 입구 → 세로 통로로 안쪽 끝 → 가로줄 한 칸씩 출입문 쪽. 한 번 지난 곳은 다시 넣지 않고, <b>🔁 다시 볼 곳</b>은 맨 뒤에 모아요.'
          : '부스 목록에서 ☆를 누르면 2홀 입구에서 출발하는 순서를 만들어 드려요.')+'</p>'
      + '<div class="crset">'
      + '<div><label for="cday">방문일</label><select id="cday">'
      + VISITS.map(v=>'<option value="'+v.k+'" '+(course.day===v.k?'selected':'')+'>'+v.label+'</option>').join('')
      + '</select></div>'
      + '<div><label for="cstart">시작 시간</label><select id="cstart">'
      + START_TIMES.map(m=>'<option value="'+m+'" '+(+course.start===m?'selected':'')+'>'+fmtMin(m)+'</option>').join('')
      + '</select></div>'
      + '<div><label for="cdwell">부스당 체류</label><select id="cdwell">'
      + [2,3,4,6,8,10].map(m=>'<option value="'+m+'" '+(dwell===m?'selected':'')+'>'+m+'분</option>').join('')
      + '</select></div>'
      + '</div>'
      + (total? '<div class="crsum">'+esc(dayLabel)+' '+fmtMin(+course.start)+' · 2홀 입구 출발 · 도면 직선 <b>'+meters.toLocaleString()+'m</b>(~'+moveMin+'분) · 부스당 '+dwell+'분 · <b>'+fmtMin(endMin)+'</b> 종료예상'
          + (anchorN? ' · ⏰ 정시 '+anchorN+'곳' : '')+'</div>'
          + '<div class="crfine">※ 거리는 도면 직선거리 환산 참고치(1,000 ≈ 260m) · 실제 보행·도착시각 아님 · 대기줄·구매시간은 빠져 있음</div>'
          + (anchorN? '<div class="crfine">⏰ 정시·오픈런 '+anchorN+'곳은 <b>시간순 우선 배치</b>라 기본 순서와 달리 <b>동선이 일부 교차</b>할 수 있어요.</div>' : '')
          : '')
      + '<div class="prog"><i style="width:'+pctv+'%"></i></div>'
      + '<div class="nums"><span>방문 완료 '+dn+' / '+total+'</span><span>'+pctv+'%</span></div>'
      + '<div class="btnrow">'
      + '<button class="btn primary" id="share">공유 링크</button>'
      + '<button class="btn" id="tobo">부스 더 담기</button>'
      + (dn? '<button class="btn" id="resetdone">방문 기록 초기화</button>': '')
      + '</div>'
      + (total? '' : coreBox())
      + '</div>';

    if(!total){
      html += '<div class="empty">아직 담은 부스가 없어요.<br><br>🔍 <b>부스</b> 탭에서 ☆를 누르거나<br>위의 <b>핵심 '+CORE_N+'곳 담기</b>, 또는 <b>품목별 담기</b>를 누르면<br>여기에 2홀 입구 출발 순서로 정리됩니다.</div></div>';
      view.innerHTML = html;
      bindCourse(); return;
    }
    let stepNo = 0, curHall = null;
    steps.forEach(s=>{
      const b = s.b;
      if(hallKey(b) !== curHall){
        curHall = hallKey(b);
        const inHall = steps.filter(x=>hallKey(x.b)===curHall).length;
        html += '<div class="hallhead"><span class="hb '+HALLCLS[b.hall]+'">'+HALLNAME[b.hall]+'</span><span class="hs">'+inHall+'곳 · 세로 진입 → 가로줄 훑기'+'</span></div>';
      }
      stepNo++;
      const isDone = done.has(b.id);
      const isRev = rev.has(b.id);
      const first = (b.ev&&b.ev.length)? b.ev[0] : '';
      const th = (s.anchor==null)? timeHint(b) : '';
      const thTxt = th ? (/시/.test(th) ? ' · ⏰ '+th : ' · '+th) : '';
      let tTxt, tCls = 'time';
      if(s.anchor != null){
        tCls += ' anchor';
        tTxt = '⏰ '+fmtMin(s.anchor)+' 이벤트 · '+fmtMin(s.arrive)+' 도착';
        if(s.late){ tCls += ' warn'; tTxt += ' (늦을 수 있어요)'; }
        else if(s.anchor - s.arrive >= 3) tTxt += ' · ' + Math.round(s.anchor - s.arrive) + '분 여유';
        if(anchorCount[s.anchor] > 1) tTxt += ' · 같은 시각 ' + anchorCount[s.anchor] + '곳 중 하나';
      } else {
        tTxt = '예상 '+fmtMin(s.arrive)+' 도착'+(s.arrive > 18*60 ? ' · 폐장 후' : '');
      }
      html += '<div class="step'+(isDone?' isdone':'')+'">'
        + '<div class="no">'+(isDone?'✓':stepNo)+'</div>'
        + '<div class="body"><div class="t" data-open="'+esc(b.id)+'">'+esc(b.label||('부스 '+b.id))+'</div>'
        + '<div class="m">'+esc(b.id)+' · '+esc(HALLNAME[b.hall])+(b.cat?' · '+esc(b.cat):'')+esc(thTxt)+'</div>'
        + '<div class="'+tCls+'">'+tTxt+'</div>'
        + (CORE_BY[b.id]? '<div class="citem in">🎯 '+esc(CORE_BY[b.id].items.join(' · '))+'</div>' : '')
        + (first? '<div class="e">'+evTag(first)+esc(first)+'</div>' : '')
        + ((CORE_BY[b.id] && CORE_BY[b.id].ck) ? '<div class="cks">'+CORE_BY[b.id].ck.map(x=>'✅ '+esc(x)).join('<br>')+'</div>' : '')
        + '<div class="acts"><button class="tick" data-done="'+(isDone?1:0)+'" data-tick="'+esc(b.id)+'">'+(isDone?'방문 완료':'방문 체크')+'</button>'
        + '<button class="tick'+(isRev?' revon':'')+'" data-rev="'+esc(b.id)+'">🔁 '+(isRev?'다시 볼 곳 담김':'다시 볼 곳')+'</button>'
        + '<button class="tick" data-star2="'+esc(b.id)+'">★ 빼기</button></div>'
        + '</div></div>';
    });
    if(revSteps.length){
      let cur = steps[steps.length-1].b, tm = endMin, no = 0;
      const rows = [];
      revSteps.slice().reverse().forEach(s=>{
        const legM = Math.round(dist(cur, s.b) * UNIT_M);
        tm += dist(cur, s.b) * WALK_MIN;
        no++;
        rows.push('<div class="rstep"><span class="rno">'+no+'</span><span>'+esc(s.b.label||('부스 '+s.b.id))
          + ' <em style="font-style:normal;color:var(--ink3)">'+esc(s.b.id)+' · '+esc(HALLNAME[s.b.hall])+'</em><br>'
          + '도면 환산 약 '+fmtMin(tm)+' 도착 · 앞 부스에서 직선 '+legM+'m</span></div>');
        cur = s.b; tm += dwell;
      });
      html += '<div class="rev"><h3>🔁 다시 볼 곳 '+revSteps.length+'곳</h3>'
        + '<div style="font-size:11.5px;color:#6d28d9;line-height:1.55;margin-bottom:5px">위 순서를 다 돈 뒤에 끝난 자리에서 가까운 순으로 되짚아요.</div>'
        + rows.join('')
        + '<div style="font-size:11px;color:#7c6ba8;margin-top:6px">※ 되짚는 구간까지 포함한 예상 시각입니다. 통로가 붐비면 더 걸려요.</div></div>';
    }
    html += '<div class="note">※ 순서는 주최 배치도(2026.11.17) 좌표 기준 <b>참고용</b>이에요. 거리는 <b>도면 직선거리</b> 환산 <b>참고치</b>(1,000 ≈ 260m · 50m/분)이고 대기·구매시간은 빠져 있어요.</div>';
    html += coreBox();
    html += '</div>';
    view.innerHTML = html;
    bindCourse();
  }
  function bindCourse(){
    document.querySelectorAll('[data-tick]').forEach(el=>el.onclick=()=>{
      const id = el.dataset.tick; done.has(id)?done.delete(id):done.add(id); save(); renderCourse();
    });
    document.querySelectorAll('[data-rev]').forEach(el=>el.onclick=()=>{
      const id = el.dataset.rev;
      if(rev.has(id)){ rev.delete(id); toast('다시 볼 곳에서 뺐어요'); }
      else { rev.add(id); toast('🔁 다시 볼 곳에 담았어요'); }
      saveRev(); renderCourse();
    });
    document.querySelectorAll('[data-star2]').forEach(el=>el.onclick=()=>{
      const id = el.dataset.star2; favs.delete(id); done.delete(id); rev.delete(id); save(); saveRev(); renderCourse();
    });
    const s = document.getElementById('share'); if(s) s.onclick = shareLink;
    const tb = document.getElementById('tobo'); if(tb) tb.onclick = ()=> switchTab('booth');
    const rd = document.getElementById('resetdone'); if(rd) rd.onclick = ()=>{ done.clear(); save(); renderCourse(); };
    view.querySelectorAll('[data-core]').forEach(el=>el.onclick=()=>{
      const id = el.dataset.core;
      favs.has(id)? favs.delete(id) : favs.add(id);
      if(!favs.has(id)){ done.delete(id); rev.delete(id); saveRev(); }
      save(); renderCourse();
    });
    view.querySelectorAll('[data-grp]').forEach(el=>el.onclick=()=>{
      const g = el.dataset.grp;
      const ids = CORE_IDS_OF(g).filter(id=>BY[id]);
      if(ids.every(id=>favs.has(id))){
        ids.forEach(id=>{ favs.delete(id); done.delete(id); rev.delete(id); });
        toast(CORE_GROUP_BY[g].label+' '+ids.length+'곳을 즐겨찾기에서 뺐어요');
      } else {
        let n = 0;
        ids.forEach(id=>{ if(!favs.has(id)){ favs.add(id); n++; } });
        toast(CORE_GROUP_BY[g].label+' '+n+'곳을 담았어요');
      }
      saveRev(); save(); renderCourse();
    });
    const ct = document.getElementById('coretoggle');
    if(ct) ct.onclick = ()=>{ coreOpen = !coreOpen; renderCourse(); };
    const ca = document.getElementById('cadd');
    if(ca) ca.onclick = ()=>{
      if(CORE_IDS.every(id=>favs.has(id))){
        CORE_IDS.forEach(id=>{ favs.delete(id); done.delete(id); rev.delete(id); });
        toast('핵심 '+CORE_N+'곳을 즐겨찾기에서 뺐어요');
      } else {
        let n = 0;
        CORE_IDS.forEach(id=>{ if(BY[id] && !favs.has(id)){ favs.add(id); n++; } });
        toast(n? '핵심 부스 '+n+'곳을 담았어요' : '이미 다 담겨 있어요');
      }
      saveRev(); save(); renderCourse();
    };
    const cd = document.getElementById('cday'); if(cd) cd.onchange = e=>{ course.day = e.target.value; saveCourse(); renderCourse(); };
    const cs = document.getElementById('cstart'); if(cs) cs.onchange = e=>{ course.start = +e.target.value; saveCourse(); renderCourse(); };
    const dw = document.getElementById('cdwell'); if(dw) dw.onchange = e=>{ course.dwell = +e.target.value; saveCourse(); renderCourse(); };
  }

  // ---------- 꼭 사야 될 리스트: 품목별 목록 ----------
  // 2026-11-22 슬랙 #메가주 요청: "내가 꼭 사야될 리스트에서 품목별로 목록리스트로 볼수잇게 해줄래"
  // 필수품목 CORE 69곳(중복 포함 78칸)을 품목(CORE_GROUPS)별로 묶고, 품목 하나를 고르면 그 품목 부스가
  // 부스번호·홀·확인 포인트·담기·방문 체크·지도 표시까지 한 목록으로 이어지게 보여 준다.
  // 기존 방문 순서(renderCourse)와 데이터는 그대로 두고 보기만 나눈다.
  let itemSel = 'all';         // 'all' | 품목 key | 'fav'(찜한 부스 전체)
  const itemOpen = new Set();  // 펼친 품목 key
  const noteOpen = new Set();  // 품목 기준·주의 문구를 펼친 key
  const ckOpen = new Set();    // 확인 포인트를 펼친 부스 id
  let focusId = null;          // 배치도에서 강조하는 부스 id

  function grpShort(g){ return g.label.replace(/\s*\(.*\)\s*$/, ''); }
  function grpIds(k){ return (CORE_GROUP_BY[k] ? CORE_IDS_OF(k) : []).filter(id=>BY[id]); }
  function itemCounts(ids){
    return {favN: ids.filter(id=>favs.has(id)).length, doneN: ids.filter(id=>done.has(id)).length};
  }
  function courseSeg(){
    return '<div class="seg">'
      + '<button data-cview="order" data-on="'+(courseView==='order'?1:0)+'">🗺️ 방문 순서</button>'
      + '<button data-cview="item" data-on="'+(courseView==='item'?1:0)+'">🛒 품목별 목록</button></div>';

  // 품목 목록의 부스 한 줄 — 이름을 누르면 부스 상세 시트가 열린다(data-open은 공통 처리)
  function itemRow(b, hideItems){
    const c = CORE_BY[b.id];
    const isFav = favs.has(b.id), isDone = done.has(b.id);
    const ck = (c && c.ck) || [];
    const others = c ? c.items.filter(x => !(hideItems && hideItems.indexOf(x) >= 0)) : [];
    const showCk = ckOpen.has(b.id);
    return '<div class="irow'+(isDone?' done':'')+'">'
      + '<span class="bnum '+HALLCLS[b.hall]+'">'+esc(b.id)+'</span>'
      + '<div class="imain">'
      +   '<div class="it" data-open="'+esc(b.id)+'">'+esc(b.label||('부스 '+b.id))+'</div>'
      +   '<div class="im">'+esc(HALLNAME[b.hall])+(b.cat? ' · '+esc(b.cat):'')+(others.length? ' · '+esc(others.join('·'))+'도 있음':'')+(b.approx? ' · 위치 근사값':'')+'</div>'
      +   '<div class="iacts">'
      +     '<button class="mini" data-ifav="'+esc(b.id)+'" data-on="'+(isFav?1:0)+'">'+(isFav?'★ 담김':'☆ 담기')+'</button>'
      +     '<button class="mini done" data-idone="'+esc(b.id)+'" data-on="'+(isDone?1:0)+'">'+(isDone?'✓ 방문함':'방문 체크')+'</button>'
      +     '<button class="mini" data-imap="'+esc(b.id)+'">🗺️ 지도</button>'
      +     (ck.length? '<button class="mini" data-ick="'+esc(b.id)+'" data-on="'+(showCk?1:0)+'">확인 '+ck.length+'</button>' : '')
      +   '</div>'
      +   (showCk? '<div class="ick">'+ck.map(x=>'✅ '+esc(x)).join('<br>')+'</div>' : '')
      + '</div></div>';
  }
  // 품목 하나 = 접었다 펴는 한 덩어리. 접혀 있을 때는 부스번호를 한 줄로 미리 보여 준다.
  function itemSection(g){
    const ids = grpIds(g.key);
    const cnt = itemCounts(ids);
    const open = itemSel===g.key || itemOpen.has(g.key);
    const prev = ids.length > 7 ? ids.slice(0,7).join('·')+' 외 '+(ids.length-7)+'곳' : ids.join('·');
    const allOn = ids.length>0 && cnt.favN===ids.length;
    return '<div class="igrp'+(cnt.favN?' hasfav':'')+'">'
      + '<div class="igh" data-iopen="'+esc(g.key)+'" role="button" aria-expanded="'+(open?'true':'false')+'">'
      +   '<div class="t"><div class="itt">'+esc(grpShort(g))+'</div>'
      +     '<div class="ms"><b>'+ids.length+'곳</b> · 담김 '+cnt.favN+' · 방문 '+cnt.doneN+'</div>'
      +     (open? '' : '<div class="iprev">'+esc(prev)+'</div>')+'</div>'
      +   '<span class="ar">'+(open?'접기 ▲':'펼치기 ▾')+'</span></div>'
      + (open? '<div class="ibody">'
          + '<div class="grow">'
          +   '<button class="mini" data-igrp="'+esc(g.key)+'" data-on="'+(allOn?1:0)+'">'+(allOn? '이 품목 '+ids.length+'곳 전부 빼기' : '이 품목 '+ids.length+'곳 전부 담기')+'</button>'
          +   '<button class="mini" data-inote="'+esc(g.key)+'" data-on="'+(noteOpen.has(g.key)?1:0)+'">기준·주의 '+(noteOpen.has(g.key)?'접기 ▲':'▾')+'</button>'
          + '</div>'
          + (noteOpen.has(g.key)? '<div class="gnote">'+esc(g.note)+'</div>' : '')
          + routeOrder(ids.map(id=>BY[id])).map(b=>itemRow(b, [grpShort(g)])).join('')
          + '</div>' : '')
      + '</div>';
  }
  // 찜한 부스(품목 리스트 밖 포함)도 같은 줄 모양으로, 동선 순서대로
  function favSection(ids, title){
    const list = routeOrder(ids.map(id=>BY[id]));
    const open = itemSel==='fav' || itemOpen.has('fav');
    const doneN = list.filter(b=>done.has(b.id)).length;
    const prev = list.length > 7 ? list.slice(0,7).map(b=>b.id).join('·')+' 외 '+(list.length-7)+'곳' : list.map(b=>b.id).join('·');
    return '<div class="igrp hasfav"><div class="igh" data-iopen="fav" role="button" aria-expanded="'+(open?'true':'false')+'"'
      + ' style="background:#fffbeb">'
      + '<div class="t"><div class="itt">'+esc(title||'★ 찜한 부스')+'</div>'
      + '<div class="ms"><b>'+list.length+'곳</b> · 방문 '+doneN+'</div>'
      + (open? '' : '<div class="iprev">'+esc(prev)+'</div>')+'</div>'
      + '<span class="ar">'+(open?'접기 ▲':'펼치기 ▾')+'</span></div>'
      + (open? '<div class="ibody">'+list.map(b=>itemRow(b, null)).join('')+'</div>' : '')
      + '</div>';
  }
  function renderItems(){
    const coreFav = CORE_IDS.filter(id=>favs.has(id)).length;
    const coreDone = CORE_IDS.filter(id=>done.has(id)).length;
    const chips = [['all','전체',CORE_N], ['fav','★ 찜한 부스',String(favs.size)]]
      .concat(CORE_GROUPS.map(g=>[g.key, grpShort(g), String(grpIds(g.key).length)]))
      .map(x=>'<button class="chip i" data-ichip="'+esc(x[0])+'" data-on="'+(itemSel===x[0]?1:0)+'">'+esc(x[1])+' <b>'+x[2]+'</b></button>')
      .join('');
    let html = '<div class="ilist">' + courseSeg()
      + '<div class="ihead"><h2>🛒 꼭 사야 될 리스트</h2>'
      + '<p>품목을 고르면 그 품목을 파는 부스가 <b>부스번호·홀·확인 포인트</b>까지 한 줄씩 나옵니다. 한 부스가 여러 품목에 있으면 품목마다 한 번씩 나와요(중복 '+CORE_OVERLAP+'칸).</p>'
      + '<div class="isum"><span>품목 '+CORE_GROUPS.length+'개</span><span>부스 '+CORE_N+'곳</span><span>담김 '+coreFav+'</span><span>방문 '+coreDone+'</span></div></div>'
      + '<div class="ibar"><div class="scroll ichips">'+chips+'</div></div>';
    if(itemSel === 'fav'){
      html += favSection([...favs].filter(id=>BY[id]), '★ 찜한 부스 (동선 순서)');
      if(!favs.size) html += '<div class="empty">아직 찜한 부스가 없어요.<br>위 품목에서 <b>☆ 담기</b>를 누르면 여기에 모입니다.</div>';
    } else {
      html += CORE_GROUPS.map(g=>itemSection(g)).join('');
      const extra = [...favs].filter(id=>BY[id] && !CORE_SET.has(id));
      if(extra.length && itemSel === 'all') html += favSection(extra, '직접 찜한 부스 (품목 리스트 밖)');
    }
    html += '<div class="ifoot">※ 표시된 '+CORE_N+'곳은 <b>방문 후보</b>예요(현장 판매·재고 확인 전). 「담기」를 누르면 내 코스 방문 순서에 들어가고, 「방문 체크」는 여기와 방문 순서에 함께 남아요. 품목 선정 기준과 제외한 곳은 <b>안내</b> 탭에 있습니다.</div>'
      + '<div class="btnrow"><button class="btn" id="iinfo">안내 탭에서 기준 보기</button><button class="btn primary" id="iorder">방문 순서로 보기</button></div>'
      + '</div>';
    view.innerHTML = html;
    bindItems();
  }
  function bindItems(){
    view.querySelectorAll('[data-ichip]').forEach(el=>el.onclick=()=>{
      const k = el.dataset.ichip;
      itemSel = k;
      if(k !== 'all' && k !== 'fav') itemOpen.add(k);   // 품목을 고르면 그 품목은 펼쳐서 보여 준다
      renderCourse();
      try{ window.scrollTo({top:0}); }catch(e){}
    });
    view.querySelectorAll('[data-iopen]').forEach(el=>el.onclick=()=>{
      const k = el.dataset.iopen;
      const openNow = (itemSel===k) || itemOpen.has(k);
      itemOpen.delete(k);
      if(openNow){ if(itemSel===k) itemSel = 'all'; }
      else itemOpen.add(k);
      renderCourse();
    });
    view.querySelectorAll('[data-ifav]').forEach(el=>el.onclick=()=>{
      const id = el.dataset.ifav;
      if(favs.has(id)){ favs.delete(id); done.delete(id); rev.delete(id); saveRev(); }
      else favs.add(id);
      save(); renderCourse();
    });
    view.querySelectorAll('[data-idone]').forEach(el=>el.onclick=()=>{
      const id = el.dataset.idone;
      done.has(id)? done.delete(id) : done.add(id);
      save(); renderCourse();
    });
    view.querySelectorAll('[data-ick]').forEach(el=>el.onclick=()=>{
      const id = el.dataset.ick;
      ckOpen.has(id)? ckOpen.delete(id) : ckOpen.add(id);
      renderCourse();
    });
    view.querySelectorAll('[data-inote]').forEach(el=>el.onclick=()=>{
      const k = el.dataset.inote;
      noteOpen.has(k)? noteOpen.delete(k) : noteOpen.add(k);
      renderCourse();
    });
    view.querySelectorAll('[data-igrp]').forEach(el=>el.onclick=()=>{
      const k = el.dataset.igrp;
      const ids = grpIds(k);
      if(ids.every(id=>favs.has(id))){
        ids.forEach(id=>{ favs.delete(id); done.delete(id); rev.delete(id); });
        toast(CORE_GROUP_BY[k].label+' '+ids.length+'곳을 즐겨찾기에서 뺐어요');
      } else {
        let n = 0;
        ids.forEach(id=>{ if(!favs.has(id)){ favs.add(id); n++; } });
        toast(CORE_GROUP_BY[k].label+' '+n+'곳을 담았어요');
      }
      saveRev(); save(); renderCourse();
    });
    view.querySelectorAll('[data-imap]').forEach(el=>el.onclick=()=> mapFocus(el.dataset.imap));
    const io = document.getElementById('iorder');
    if(io) io.onclick = ()=>{ courseView='order'; course.view='order'; saveCourse(); renderCourse(); };
    const ii = document.getElementById('iinfo');
    if(ii) ii.onclick = ()=> switchTab('info');
  }
  // 품목 목록의 「지도」 — 배치도 탭으로 넘어가 그 부스 홀을 열고 빨간 테두리로 표시
  function mapFocus(id){
    const b = BY[id]; if(!b) return;
    focusId = id;
    mapView = MAP_VIEWS[b.hall] ? b.hall : 'all';
    mapZoom = {s:1, tx:0, ty:0};
    pinMode = false;
    switchTab('map');
    toast(b.id+' 부스 위치를 표시했어요');
  }

  // ---------- 배치도 v2: 홀 전환·확대/이동·부스 탭·내 위치 핀·편의시설 ----------
  // 홀 버튼을 눌러도 동선·핀이 지워지지 않도록, 이미지와 오버레이(SVG)를 따로 두고
  // 홀을 바꿀 때 오버레이를 다시 그린다(2026-11-19 renderMap 회귀 수정).
  const MAP_VIEWS = {
    all:{x0:0, y0:0, x1:996.6, y1:997.5, src:'map_full.jpg', name:'전체'},
    '2':{x0:0, y0:0, x1:238, y1:997.5, src:'map_h2.jpg', name:'2홀'},
    '3':{x0:238, y0:0, x1:472, y1:997.5, src:'map_h3.jpg', name:'3홀'},
    '4':{x0:472, y0:0, x1:712, y1:997.5, src:'map_h4.jpg', name:'4홀'},
    '5':{x0:712, y0:0, x1:996.6, y1:997.5, src:'map_h5.jpg', name:'5홀'}
  };
  const FAC_COLOR = {petwc:'#0e9f6e', cafe:'#8b5e34', gate:'#111827', zone:'#2563eb'};
  const FAC_ICON = {petwc:'🐾', cafe:'☕', gate:'🚪', zone:'★'};
  function mapV(){ return MAP_VIEWS[mapView] || MAP_VIEWS.all; }
  function applyZoom(){
    const st0 = document.getElementById('stage');
    if(st0) st0.style.touchAction = mapZoom.s > 1 ? 'none' : 'pan-y';
    const z = document.getElementById('zoomer');
    if(z) z.style.transform = 'translate('+mapZoom.tx.toFixed(1)+'px,'+mapZoom.ty.toFixed(1)+'px) scale('+mapZoom.s.toFixed(2)+')';
    const lab = document.getElementById('zlab');
    if(lab) lab.textContent = mapZoom.s.toFixed(1)+'×';
  }
  function clampPan(){
    const st = document.getElementById('stage');
    if(!st) return;
    const w = st.clientWidth, h = st.clientHeight;
    if(mapZoom.s <= 1.001){ mapZoom.s = 1; mapZoom.tx = 0; mapZoom.ty = 0; return; }
    mapZoom.tx = Math.min(0, Math.max(w - w*mapZoom.s, mapZoom.tx));
    mapZoom.ty = Math.min(0, Math.max(h - h*mapZoom.s, mapZoom.ty));
  }
  function zoomAt(px, py, k){
    const s = Math.min(8, Math.max(1, mapZoom.s*k));
    const r = s/mapZoom.s;
    mapZoom.tx = px - (px - mapZoom.tx)*r;
    mapZoom.ty = py - (py - mapZoom.ty)*r;
    mapZoom.s = s;
    clampPan(); applyZoom();
  }
  function stagePtToMap(px, py){
    const st = document.getElementById('stage');
    const v = mapV();
    if(!st) return {x:v.x0, y:v.y0};
    const cw = st.clientWidth * mapZoom.s, ch = st.clientHeight * mapZoom.s;
    return {x: v.x0 + ((px - mapZoom.tx)/cw) * (v.x1-v.x0),
            y: v.y0 + ((py - mapZoom.ty)/ch) * (v.y1-v.y0)};
  }
  function nearestBooth(m, rad){
    let best = null, bd = Infinity;
    BOOTHS.forEach(b=>{
      const d = Math.hypot(b.x-m.x, (b.y-m.y)*0.9);
      if(d < bd){ bd = d; best = b; }
    });
    return bd <= rad ? best : null;
  }
  function setHere(m){
    const d = new Date();
    const hh = ('0'+d.getHours()).slice(-2), mm = ('0'+d.getMinutes()).slice(-2);
    here = {x: Math.round(m.x*10)/10, y: Math.round(m.y*10)/10, t: hh+':'+mm};
    saveHere();
    renderMap();
    toast('내 위치를 찍었어요 · '+hh+':'+mm+' (직접 지정)');
  }
  function openSheet(id){
    const b = BY[id]; if(!b) return;
    const el = document.getElementById('sheet'); if(!el) return;
    const isFav = favs.has(id);
    const evs = (b.ev||[]).map(e=>'<div class="item">'+evTag(e)+esc(e)+'</div>').join('');
    el.innerHTML = '<div class="grab"></div>'
      + '<div class="sh"><span class="bnum '+HALLCLS[b.hall]+'">'+esc(b.id)+'</span>'
      + '<div class="name"><div class="t">'+esc(b.label||('부스 '+b.id))+'</div>'
      + '<div class="m">'+esc(HALLNAME[b.hall])+(b.cat? ' · '+esc(b.cat):'')+(b.approx? ' · 위치 근사값':'')+'</div></div>'
      + '<button class="x" id="sheetx" aria-label="닫기">✕</button></div>'
      + (evs? '<div style="margin-top:9px"><div style="font-size:11px;font-weight:800;color:var(--brand);margin-bottom:3px">현장 이벤트 '+b.ev.length+'건</div>'+evs+'</div>'
            : '<div style="margin-top:9px;font-size:12px;color:var(--ink3)">공개된 현장 이벤트가 없어요(정보 없음이지 이벤트가 없다는 뜻은 아닙니다).</div>')
      + priceBlock(b) + coreItemLine(b) + ckBlock(b)
      + '<div class="btnrow"><button class="btn primary" id="sheetfav">'+(isFav? '★ 내 코스에서 빼기':'☆ 내 코스에 담기')+'</button>'
      + '<button class="btn" id="sheetcourse">내 코스 보기</button></div>';
    el.classList.add('on');
    const sx = document.getElementById('sheetx'); if(sx) sx.onclick = closeSheet;
    const sf = document.getElementById('sheetfav');
    if(sf) sf.onclick = ()=>{
      if(favs.has(id)){ favs.delete(id); done.delete(id); rev.delete(id); saveRev(); } else favs.add(id);
      save(); openSheet(id); paintOverlay();
      if(tab==='course') renderCourse();
    };
    const sc = document.getElementById('sheetcourse'); if(sc) sc.onclick = ()=>{ closeSheet(); switchTab('course'); };
  }
  function closeSheet(){
    const el = document.getElementById('sheet');
    if(!el) return;
    el.classList.remove('on');
    // 화면 밖으로 내려간 뒤 내용을 비워 접근성 트리에도 남지 않게 한다
    clearTimeout(el._t);
    el._t = setTimeout(function(){ if(!el.classList.contains('on')) el.innerHTML = ''; }, 260);
  }
  function paintOverlay(){
    const svg = document.getElementById('mapsvg');
    if(!svg) return;
    const v = mapV();
    svg.setAttribute('viewBox', v.x0+' '+v.y0+' '+(v.x1-v.x0)+' '+(v.y1-v.y0));
    const steps = buildRoute([...favs], courseOpt());
    const inV = (x,y,mg)=> x >= v.x0-mg && x <= v.x1+mg && y >= v.y0-mg && y <= v.y1+mg;
    let s = '<g fill="#64748b" opacity="0.30">';
    BOOTHS.forEach(b=>{ if(inV(b.x,b.y,3)) s += '<circle cx="'+b.x+'" cy="'+b.y+'" r="1.4"/>'; });
    s += '</g>';
    if(facOn){
      (MZ.fac||[]).forEach(f=>{
        if(!inV(f.x,f.y,8)) return;
        const col = FAC_COLOR[f.k] || '#2563eb';
        s += '<g transform="translate('+f.x+','+f.y+') scale(1,0.706)">'
          + '<circle r="9" fill="'+col+'" fill-opacity="0.92" stroke="#fff" stroke-width="1.8"/>'
          + '<text y="3.4" text-anchor="middle" font-size="9.5">'+(FAC_ICON[f.k]||'★')+'</text>'
          + '</g>';
      });
    }
    if(steps.length > 1){
      const pts = steps.map(x=>x.b.x.toFixed(1)+','+x.b.y.toFixed(1)).join(' ');
      s += '<polyline points="'+pts+'" fill="none" stroke="#f05322" stroke-width="3.2" stroke-opacity="0.75" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    steps.forEach((x,i)=>{
      if(!inV(x.b.x,x.b.y,8)) return;
      const fill = i===0 ? '#16a34a' : (done.has(x.b.id) ? '#94a3b8' : '#f05322');
      s += '<g transform="translate('+x.b.x+','+x.b.y+') scale(1,0.706)">'
        + '<circle r="'+(i===0? 7 : 5.6)+'" fill="'+fill+'" fill-opacity="0.95" stroke="#fff" stroke-width="1.2"/>'
        + (steps.length <= 40 ? '<text y="2.1" text-anchor="middle" font-size="6" fill="#fff" font-weight="700">'+(i+1)+'</text>' : '')
        + '</g>';
    });
    if(steps.length){
      const rv = steps.filter(x=>rev.has(x.b.id));
      if(rv.length){
        const chain = [steps[steps.length-1].b].concat(rv.slice().reverse().map(s=>s.b));
        const pts = chain.map(x=>x.x.toFixed(1)+','+x.y.toFixed(1)).join(' ');
        s += '<polyline points="'+pts+'" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="6 4" stroke-opacity="0.85"/>';
      }
    }
    if(here){
      s += '<g transform="translate('+here.x+','+here.y+') scale(1,0.706)">'
        + '<circle r="11" fill="#dc2626" fill-opacity="0.22"/>'
        + '<circle r="6" fill="#dc2626" stroke="#fff" stroke-width="2"/>'
        + '<text y="-13" text-anchor="middle" font-size="9" font-weight="700" fill="#b91c1c">내 위치</text></g>';
    }
    // 품목 목록의 「지도」로 지정한 부스 강조 — 동선 핀과 겹쳐도 보이게 테두리만 그린다
    if(focusId && BY[focusId] && inV(BY[focusId].x, BY[focusId].y, 40)){
      const f = BY[focusId];
      s += '<g transform="translate('+f.x+','+f.y+') scale(1,0.706)">'
        + '<circle r="17" fill="#dc2626" fill-opacity="0.14"/>'
        + '<circle r="11" fill="none" stroke="#dc2626" stroke-width="3.4"/>'
        + '<circle r="3.6" fill="#dc2626" stroke="#fff" stroke-width="1.2"/></g>'
        + '<text x="'+f.x+'" y="'+(f.y-17)+'" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c" stroke="#fff" stroke-width="2.6" paint-order="stroke">'+esc(f.id)+'</text>';
    }
    svg.innerHTML = s;
  }
  function mapLegend(steps){

  function bindMap(){
    const st = document.getElementById('stage');
    if(!st) return;
    view.querySelectorAll('[data-map]').forEach(el=>el.onclick=()=>{
      mapView = el.dataset.map;
      mapZoom = {s:1, tx:0, ty:0};
      const sb = document.getElementById('sheet'); if(sb) sb.classList.remove('on');
      renderMap();
    });
    const zi = document.getElementById('zin'), zo = document.getElementById('zout'), zf = document.getElementById('zfit');
    if(zi) zi.onclick = ()=>{ zoomAt(st.clientWidth/2, st.clientHeight/2, 1.5); };
    if(zo) zo.onclick = ()=>{ zoomAt(st.clientWidth/2, st.clientHeight/2, 1/1.5); };
    if(zf) zf.onclick = ()=>{ mapZoom = {s:1, tx:0, ty:0}; applyZoom(); };
    const fb = document.getElementById('facbtn'); if(fb) fb.onclick = ()=>{ facOn = !facOn; renderMap(); };
    const pb = document.getElementById('pinbtn'); if(pb) pb.onclick = ()=>{ pinMode = !pinMode; renderMap(); };
    const pc = document.getElementById('pinclear'); if(pc) pc.onclick = ()=>{ here = null; saveHere(); renderMap(); toast('핀을 지웠어요'); };
    const fc = document.getElementById('focusclr'); if(fc) fc.onclick = ()=>{ focusId = null; renderMap(); };

    const pts = new Map();
    let drag = null, pinch = null, pressT = null, pinched = false;
    const rel = e=>{ const r = st.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
    st.onpointerdown = e=>{
      const p = rel(e);
      pts.set(e.pointerId, p);
      try{ st.setPointerCapture(e.pointerId); }catch(_){}
      if(pts.size === 1){
        drag = {p0:p, tx:mapZoom.tx, ty:mapZoom.ty, moved:0, long:false};
        clearTimeout(pressT);
        pressT = setTimeout(()=>{
          if(drag && drag.moved < 8 && !pinMode){ drag.long = true; setHere(stagePtToMap(p.x, p.y)); }
        }, 560);
      } else if(pts.size === 2){
        clearTimeout(pressT);
        pinched = true;
        const a = [...pts.values()];
        pinch = {d: Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1, s: mapZoom.s,
                 cx:(a[0].x+a[1].x)/2, cy:(a[0].y+a[1].y)/2, tx:mapZoom.tx, ty:mapZoom.ty};
        drag = null;
      }
    };
    st.onpointermove = e=>{
      if(!pts.has(e.pointerId)) return;
      const p = rel(e); pts.set(e.pointerId, p);
      if(pinch && pts.size >= 2){
        const a = [...pts.values()];
        const d = Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y) || 1;
        const sc = Math.min(8, Math.max(1, pinch.s * d / pinch.d));
        const k = sc / pinch.s;
        mapZoom.s = sc;
        mapZoom.tx = pinch.cx - (pinch.cx - pinch.tx) * k;
        mapZoom.ty = pinch.cy - (pinch.cy - pinch.ty) * k;
        clampPan(); applyZoom();
        return;
      }
      if(drag){
        const dx = p.x - drag.p0.x, dy = p.y - drag.p0.y;
        drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
        if(drag.moved > 6){
          clearTimeout(pressT);
          mapZoom.tx = drag.tx + dx; mapZoom.ty = drag.ty + dy;
          clampPan(); applyZoom();
        }
      }
    };
    st.onpointerup = e=>{
      clearTimeout(pressT);
      const p = rel(e);
      const dragged = drag ? drag.moved > 8 : false;
      const longed = drag ? drag.long : false;
      pts.delete(e.pointerId);
      if(pts.size < 2) pinch = null;
      if(!dragged && !longed && !pinch && !pinched){
        if(pinMode){ pinMode = false; setHere(stagePtToMap(p.x, p.y)); return; }
        const v = mapV();
        const perPx = (st.clientWidth * mapZoom.s) / (v.x1 - v.x0);   // 도면 단위 / px
        const b = nearestBooth(stagePtToMap(p.x, p.y), 26 / perPx);
        if(b) openSheet(b.id);
      }
      if(pts.size === 0){ drag = null; pinched = false; }
    };
    st.onpointercancel = e=>{ clearTimeout(pressT); pts.delete(e.pointerId); pinch = null; drag = null; };
    st.addEventListener('wheel', e=>{
      e.preventDefault();
      const p = rel(e);
      zoomAt(p.x, p.y, e.deltaY < 0 ? 1.2 : 1/1.2);
    }, {passive:false});
    applyZoom();
  }

      + '<li>온라인 가격은 <b>2026.11.17~18 조회</b>. 강조 숫자는 <b>배송 포함 총액</b>이고, “관측가”는 가격추적 사이트 값이라 바꿀 수 있습니다. 정기구독·쿠폰가·묶음은 1회 구매가가 아닙니다</li>'
      + '</ul></div></div>'
      + '<div class="box"><h3 id="ih5" style="cursor:pointer">동선·지도 읽는 법 ▾</h3><div class="fold" id="ib5"><ul>'
      + '<li>동선은 <b>2홀 입구 고정</b> — 세로 통로로 안쪽 끝까지 → 가로줄을 출입문 쪽으로 한 줄씩</li>'
      + '<li>한 번 지나온 부스는 다시 넣지 않고, <b>🔁 다시 볼 곳</b>은 동선을 다 돈 뒤 되짚는 순서로 따로 나옵니다</li>'
      + '<li>부스당 체류는 <b>2~10분</b>에서 바꿀 수 있어요. 거리는 <b>도면 직선거리 환산 참고치</b>이고 대기·구매시간은 빠져 있습니다</li>'
      + '<li>배치도에서 <b>부스를 누르면</b> 정보가 열리고, <b>길게 누르면 내 위치 핀</b>을 찍습니다(자동 GPS 아님)</li>'
      + '</ul></div></div>'
      + '</div>';
    view.innerHTML = html;
    [1,2,3,4,5].forEach(i=>{
      const h = document.getElementById('ih'+i);
      if(h) h.onclick = ()=>{ const b = document.getElementById('ib'+i); if(b) b.classList.toggle('open'); };
    });
  }

  let _dt;
  function debounce(fn, ms){ clearTimeout(_dt); _dt = setTimeout(fn, ms); }
  // 검색 입력: 입력창 DOM은 그대로 두고 결과 목록만 갱신, 한글 조합 중에는 갱신을 미룬다
  let _composing = false;
  function bindSearch(paint){
    const qi = document.getElementById('q');
    if(!qi) return;
    qi.addEventListener('compositionstart', ()=>{ _composing = true; });
    qi.addEventListener('compositionend', ()=>{ _composing = false; q = qi.value; debounce(paint, 60); });
    qi.addEventListener('input', e=>{
      q = e.target.value;
      const c = document.getElementById('clr'); if(c) c.style.display = q? 'block' : 'none';
      if(_composing || e.isComposing) return;
      debounce(paint, 180);
    });
    const clr = document.getElementById('clr');
    if(clr) clr.onclick = ()=>{ q=''; qi.value=''; clr.style.display='none'; paint(); };
  }

  function updateFavBadge(){
    const n = favs.size;
    document.getElementById('stFav').textContent = n;
    const b = document.getElementById('navFav');
    b.style.display = n? 'block':'none'; b.textContent = n;
  }
  function switchTab(t){
    tab = t;
    document.querySelectorAll('nav button').forEach(b=>b.dataset.on = (b.dataset.tab===t?1:0));
    if(t==='booth') renderBooth();
    else if(t==='event') renderEvent();
    else if(t==='price') renderPrice();
    else if(t==='course') renderCourse();
    else if(t==='map') renderMap();
    else renderInfo();
    window.scrollTo({top:0});
  }
  document.querySelectorAll('nav button').forEach(b=> b.onclick = ()=> switchTab(b.dataset.tab));

  // global card interactions (delegated)
  document.addEventListener('click', e=>{
    const s = e.target.closest('[data-star]');
    if(s){
      const id = s.dataset.star;
      favs.has(id)? favs.delete(id) : favs.add(id);
      if(!favs.has(id)) done.delete(id);
      save();
      s.dataset.fav = favs.has(id)?'1':'0';
      s.textContent = favs.has(id)?'★':'☆';
      var cc = s.closest('.card'); if(cc) cc.classList.toggle('fav', favs.has(id));
      if(tab==='course') renderCourse();
      if(evFilter.has('fav')) { tab==='booth'?renderBooth():renderEvent(); }
      return;
    }
    const mo = e.target.closest('[data-more]');
    if(mo){
      const el = document.getElementById('ev-'+mo.dataset.more);
      if(el){ el.classList.toggle('open'); var op=el.classList.contains('open'); var lbl=mo.getAttribute('data-label')||mo.textContent; if(!mo.getAttribute('data-label')) mo.setAttribute('data-label',lbl); mo.textContent = op? '접기' : lbl; }
      return;
    }
    const de = e.target.closest('[data-desc]');
    if(de){
      const el = document.getElementById('dsc-'+de.dataset.desc);
      if(el){ el.classList.toggle('open'); de.textContent = el.classList.contains('open')? '브랜드 설명 접기 ▲' : '브랜드 설명 ▾'; }
      return;
    }
    const op2 = e.target.closest('[data-open]');
    if(op2){ openSheet(op2.dataset.open); return; }
    // 방문 순서 ↔ 품목별 목록 보기 전환 — 두 보기 모두 같은 seg를 쓰므로 공통 처리
    const cv = e.target.closest('[data-cview]');
    if(cv){
      courseView = cv.dataset.cview === 'item' ? 'item' : 'order';
      course.view = courseView; saveCourse(); renderCourse(); return;
    }
  });

  // init
  readHash();
  updateFavBadge();
  document.getElementById('stBooth').textContent = MZ.meta.boothCount;
  document.getElementById('stBrand').textContent = MZ.meta.brandCount;
  document.getElementById('stEv').textContent = MZ.meta.eventBoothCount;
  const hashTab = (location.hash.match(/tab=(\w+)/)||[])[1];
  // 공유·바로가기용: #tab=course&v=item 이면 품목별 목록으로 바로 연다
  if((location.hash.match(/v=(\w+)/)||[])[1] === 'item'){ courseView = 'item'; course.view = 'item'; }
  switchTab(hashTab && ['booth','event','price','course','map','info'].includes(hashTab) ? hashTab : 'booth');

  // 계산 로직을 검증에 그대로 쓸 수 있게 노출 (화면 동작에는 영향 없음)
  // 화면·계산 검증(회귀 테스트)에서 그대로 부를 수 있게 노출 — 화면 동작에는 영향 없음
  window.MZTEST = {
    setView: function(k){ mapView = k; mapZoom = {s:1, tx:0, ty:0}; renderMap(); },
    viewHtml: function(){ return document.getElementById('view').innerHTML; },
    overlayHtml: function(){ var s = document.getElementById('mapsvg'); return s ? s.innerHTML : ''; },
    setFavs: function(ids){ favs = new Set(ids); save(); },
    setRev: function(ids){ rev = new Set(ids); saveRev(); },
    setHere: function(x,y){ here = {x:x, y:y, t:'09:00'}; saveHere(); renderMap(); },
    getHere: function(){ return here; },
    goTab: function(t){ switchTab(t); },
    setCourseView: function(v){ courseView = (v==='item'?'item':'order'); renderCourse(); },
    setItemSel: function(k){ itemSel = k||'all'; renderCourse(); },
    getItemSel: function(){ return itemSel; },
    getFocus: function(){ return focusId; },
    setDone: function(ids){ done = new Set(ids); save(); },
    focusBooth: function(id){ mapFocus(id); },
    clearFocus: function(){ focusId = null; renderMap(); }
  };
  window.MZROUTE = {buildRoute: buildRoute, routeOrder: routeOrder, hallRoute: hallRoute, orderByHall: orderByHall,
    evTimesFor: evTimesFor, evNoBuy: evNoBuy, ROW_BANDS: ROW_BANDS, ROW_OF: ROW_OF, ENTRIES: ENTRIES,
    HALL_GEO: HALL_GEO, GATES: GATES, COL_OF: COL_OF, MAP_VIEWS: MAP_VIEWS, CORE: CORE, courseOpt: courseOpt,
    CORE_GROUPS: CORE_GROUPS, grpShort: grpShort, CORE_SET: CORE_SET,
    hallKey: hallKey, UNIT_M: UNIT_M,
    YCORR: YCORR, dist: dist, PACE_MPM: PACE_MPM};
})();
</script>
</body>
</html>
